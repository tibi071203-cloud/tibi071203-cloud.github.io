<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Napi Hírek</title>
<meta name="description" content="Napi politikai és tőzsdei hírösszefoglaló">
<meta name="theme-color" content="#0d1a33">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Napi Hírek">
<style>
:root{--bg:#0b1426;--bg2:#111d35;--card:#15223d;--line:#22335a;--tx:#eaf0fb;--tx2:#9fb0cf;--acc:#4da3ff;--up:#2ecc71;--down:#ff5d5d;--flat:#a8b3c7;--r:16px}
@media (prefers-color-scheme: light){:root{--bg:#f2f5fa;--bg2:#fff;--card:#fff;--line:#dde4ef;--tx:#0f1b2e;--tx2:#5a6a85;--acc:#1f6fe0;--up:#14924a;--down:#d63031}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:calc(10px + env(safe-area-inset-top)) 16px 8px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px}
.top img{width:34px;height:34px;border-radius:9px}
.top h1{font-size:20px;margin:0;flex:1;letter-spacing:-.2px}
.ibtn{border:0;background:var(--card);color:var(--tx);width:40px;height:40px;border-radius:12px;font-size:19px;display:grid;place-items:center;cursor:pointer;border:1px solid var(--line)}
.ibtn:active{transform:scale(.94)}
.sub{color:var(--tx2);font-size:13px;margin-top:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--tx2)}
.pill.ai{background:color-mix(in srgb,var(--acc) 22%,transparent);color:var(--acc)}
nav.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 2px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--tx2);padding:7px 13px;border-radius:99px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
main{padding:12px 16px;max-width:760px;margin:0 auto}
.hero{background:linear-gradient(135deg,#1d4fa8,#0f2c63);color:#fff;border-radius:var(--r);padding:16px 18px;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.hero small{opacity:.8;font-weight:700;letter-spacing:.6px;text-transform:uppercase;font-size:11px}
.hero p{margin:6px 0 0;font-size:18px;font-weight:650;line-height:1.35}
section.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 10px;margin-bottom:14px}
.sec h2{font-size:17px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.pt{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.pt:first-of-type{border-top:0}
.pt .dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--acc);margin-top:9px}
.pt .tx{flex:1}
.pt a{color:inherit;text-decoration:none}
.src{display:inline-flex;gap:4px;flex-wrap:wrap;margin-left:4px}
.src span{font-size:11px;color:var(--tx2);background:var(--bg);border:1px solid var(--line);padding:0 6px;border-radius:6px;white-space:nowrap}
details.more{margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
details.more summary{color:var(--acc);font-size:14px;font-weight:600;cursor:pointer;list-style:none;padding:4px 0}
details.more summary::-webkit-details-marker{display:none}
details.more a{display:block;color:var(--tx);text-decoration:none;font-size:14px;padding:7px 0;border-top:1px solid var(--line)}
details.more a i{color:var(--tx2);font-style:normal;font-size:12px}
.qgrp{font-size:12px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.6px;margin:12px 0 6px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.q{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 10px}
.q .n{font-size:13px;color:var(--tx2);font-weight:600}
.q .p{font-size:17px;font-weight:750;margin-top:2px;font-variant-numeric:tabular-nums}
.q .p small{font-size:11px;color:var(--tx2);font-weight:600}
.q .c{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--flat)}
.q svg{width:100%;height:26px;display:block;margin-top:4px}
.empty{text-align:center;color:var(--tx2);padding:50px 20px}
.empty b{display:block;color:var(--tx);font-size:18px;margin-bottom:6px}
.note{color:var(--tx2);font-size:12px;text-align:center;margin:8px 0 20px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;background:var(--bg2);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.bar button{flex:1;border:0;background:none;color:var(--tx2);font:600 11px system-ui;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;cursor:pointer}
.bar button span{font-size:21px}
.bar button.on{color:var(--acc)}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet .box{background:var(--bg2);width:100%;max-width:760px;max-height:85vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.sheet h3{margin:4px 0 12px;font-size:19px;display:flex;align-items:center}
.sheet h3 button{margin-left:auto}
.arch{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;font:inherit}
.arch b{display:block;font-size:14px}
.arch span{font-size:13px;color:var(--tx2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.btn{border:0;background:var(--acc);color:#fff;font:700 15px system-ui;padding:12px 16px;border-radius:12px;cursor:pointer;width:100%;margin:6px 0}
.btn.sec2{background:var(--card);color:var(--tx);border:1px solid var(--line)}
textarea{width:100%;height:120px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:12px ui-monospace,monospace;padding:8px}
.steps{padding-left:20px;color:var(--tx2);font-size:14px}
.steps li{margin:5px 0}
#ptr{position:fixed;top:calc(70px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-60px);z-index:15;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:13px;color:var(--tx2);transition:transform .2s}
#getApp{margin:10px 16px 0;padding:12px 14px;border-radius:14px;background:linear-gradient(135deg,#1f7a46,#14532f);color:#fff;display:flex;gap:12px;align-items:center}
#getApp img{width:44px;height:44px;border-radius:11px;flex:none}
#getApp .t{flex:1;font-size:14px;line-height:1.3}#getApp .t b{display:block;font-size:15px}
#getApp button,#getApp a.b{border:0;background:#fff;color:#14532f;font:800 14px system-ui;padding:9px 13px;border-radius:10px;cursor:pointer;text-decoration:none;white-space:nowrap}
#getApp .x{background:none;color:#fff;opacity:.7;padding:4px 6px;font-size:18px}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111c;color:#fff;padding:8px 14px;border-radius:10px;font-size:14px;z-index:60;display:none}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--line),var(--card),var(--line));background-size:200% 100%;animation:sh 1.2s infinite;margin:10px 0}
@keyframes sh{to{background-position:-200% 0}}
</style>
</head>
<body>
<header>
  <div class="top">
    <img src="icon-192.png" alt="">
    <h1>Napi Hírek</h1>
    <button class="ibtn" id="refresh" title="Frissítés" aria-label="Frissítés">⟳</button>
  </div>
  <div class="sub" id="meta"><span class="skel" style="width:160px;margin:2px 0"></span></div>
</header>
<div id="getApp" style="display:none"></div>
<nav class="tabs" id="tabs"></nav>
<div id="ptr">↓ Húzd le a frissítéshez</div>
<main id="main">
  <div class="skel" style="height:90px;border-radius:16px"></div><div class="skel"></div><div class="skel" style="width:70%"></div><div class="skel"></div>
</main>

<div class="bar">
  <button class="on" data-v="news"><span>📰</span>Hírek</button>
  <button data-v="quotes"><span>📈</span>Árfolyamok</button>
  <button data-v="archive"><span>🗂️</span>Archívum</button>
  <button data-v="settings"><span>⚙️</span>Beállítások</button>
</div>

<div class="sheet" id="sArchive"><div class="box"><h3>Archívum <button class="ibtn" data-close>✕</button></h3><div id="archList"></div></div></div>
<div class="sheet" id="sSettings"><div class="box">
  <h3>Beállítások <button class="ibtn" data-close>✕</button></h3>
  <div id="installBox"></div>
  <h4 style="margin:14px 0 6px">🔔 Értesítések</h4>
  <p style="color:var(--tx2);font-size:14px;margin:0 0 8px">Reggel és este értesítést kapsz, amikor megérkezik a friss összefoglaló.</p>
  <div id="pushBox"></div>
</div></div>
<div id="toast"></div>

<script>
'use strict';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const SECTIONS = [['hu_pol', '🇭🇺', 'Magyar politika', 'Magyar'], ['world', '🌍', 'Világpolitika', 'Világ'], ['hu_mkt', '📊', 'Magyar gazdaság és tőzsde', 'Magyar tőzsde'], ['w_mkt', '💹', 'Világgazdaság és tőzsde', 'Világtőzsde']];
const QGRP = [['hu', '🇭🇺 Budapesti tőzsde'], ['fx', '💱 Forint'], ['w', '🌍 Világpiac'], ['c', '🛢️ Nyersanyag és kripto']];
let doc = null, view = 'news', tab = 'all', viewingArchive = false;

function toast(t) { const el = $('#toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => (el.style.display = 'none'), 2200); }
const fmt = (n) => n == null ? '–' : n.toLocaleString('hu-HU', { maximumFractionDigits: n >= 1000 ? 0 : n >= 10 ? 2 : 4 });
const chgCls = (c) => c == null ? 'flat' : c > 0.05 ? 'up' : c < -0.05 ? 'down' : 'flat';
const chgTxt = (c) => c == null ? '' : (c > 0 ? '▲ +' : c < 0 ? '▼ ' : '') + c.toFixed(2).replace('.', ',') + '%';
function spark(a, cls) {
  if (!a || a.length < 2) return '';
  const mn = Math.min(...a), mx = Math.max(...a), r = mx - mn || 1;
  const pts = a.map((v, i) => (i / (a.length - 1) * 100).toFixed(1) + ',' + (24 - (v - mn) / r * 22 + 1).toFixed(1)).join(' ');
  return '<svg viewBox="0 0 100 26" preserveAspectRatio="none"><polyline points="' + pts + '" fill="none" stroke="currentColor" stroke-width="2" vector-effect="non-scaling-stroke" class="' + cls + '"/></svg>';
}

async function getJSON(url) {
  const r = await fetch(url + (url.includes('?') ? '&' : '?') + 't=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function load(id) {
  try {
    doc = await getJSON(id ? 'data/archive/' + id + '.json' : 'data/latest.json');
    viewingArchive = !!id;
    try { localStorage.setItem('hirapp-last', JSON.stringify(doc)); } catch (e) {}
  } catch (e) {
    if (!doc) { try { doc = JSON.parse(localStorage.getItem('hirapp-last') || 'null'); } catch (e2) {} }
    if (!doc) { $('#meta').textContent = ''; $('#main').innerHTML = '<div class="empty"><b>Még nincs összefoglaló</b>Az első reggel 7-kor vagy este 6-kor érkezik.<br>(GitHubon az Actions fülön kézzel is elindíthatod.)</div>'; return; }
    toast(navigator.onLine ? 'Nem sikerült frissíteni' : 'Nincs internet – a legutóbbit mutatom');
  }
  render();
}

function render() {
  if (!doc) return;
  const d = new Date(doc.created);
  const when = d.toLocaleString('hu-HU', { month: 'long', day: 'numeric', weekday: 'long', hour: '2-digit', minute: '2-digit' });
  $('#meta').innerHTML = (doc.kind === 'reggel' ? '☀️ Reggeli' : '🌙 Esti') + ' összefoglaló · ' + esc(when) + (doc.ai ? ' <span class="pill ai">AI összefoglaló</span>' : ' <span class="pill">címválogatás</span>') + (viewingArchive ? ' <span class="pill" style="cursor:pointer" id="backLatest">archív · vissza a legfrissebbhez</span>' : '');
  const bl = $('#backLatest'); if (bl) bl.onclick = () => load();
  // fülek
  const tabs = view === 'news' ? [['all', 'Mind']].concat(SECTIONS.map((s) => [s[0], s[3]])) : [];
  $('#tabs').innerHTML = tabs.map(([k, t]) => '<button class="tab' + (k === tab ? ' on' : '') + '" data-t="' + k + '">' + t + '</button>').join('');
  $('#tabs').style.display = tabs.length ? 'flex' : 'none';
  let h = '';
  if (view === 'news') {
    if (doc.headline && tab === 'all') h += '<div class="hero"><small>A nap híre</small><p>' + esc(doc.headline) + '</p></div>';
    for (const [k, ic, title] of SECTIONS) {
      if (tab !== 'all' && tab !== k) continue;
      const pts = (doc.sections && doc.sections[k]) || [];
      h += '<section class="sec"><h2>' + ic + ' ' + title + '</h2>';
      if (!pts.length) h += '<div class="pt"><div class="tx" style="color:var(--tx2)">Ebben a rovatban most nincs friss hír.</div></div>';
      for (const p of pts) {
        const txt = p.link ? '<a href="' + esc(p.link) + '" target="_blank" rel="noopener">' + esc(p.text) + '</a>' : esc(p.text);
        h += '<div class="pt"><div class="dot"></div><div class="tx">' + txt + ' <span class="src">' + (p.sources || []).map((s) => '<span>' + esc(s) + '</span>').join('') + '</span></div></div>';
      }
      const links = (doc.links && doc.links[k]) || [];
      if (links.length && doc.ai) h += '<details class="more"><summary>Eredeti cikkek (' + links.length + ')</summary>' + links.map((l) => '<a href="' + esc(l.link) + '" target="_blank" rel="noopener">' + esc(l.title) + ' <i>· ' + esc(l.source) + '</i></a>').join('') + '</details>';
      if ((k === 'hu_mkt' || k === 'w_mkt') && doc.quotes && doc.quotes.length) h += quotesHTML(k === 'hu_mkt' ? ['hu', 'fx'] : ['w', 'c']);
      h += '</section>';
    }
  } else if (view === 'quotes') {
    h += '<section class="sec"><h2>📈 Árfolyamok</h2>' + (doc.quotes && doc.quotes.length ? quotesHTML(QGRP.map((g) => g[0])) : '<p style="color:var(--tx2)">Most nincs árfolyamadat.</p>') + '<p class="note" style="margin-bottom:4px">Napi változás az előző záráshoz képest · grafikon: utolsó ~20 nap</p></section>';
  }
  h += '<p class="note">Tájékoztató jellegű összefoglaló, nem befektetési tanács.</p>';
  $('#main').innerHTML = h;
}
function quotesHTML(groups) {
  let h = '';
  for (const [g, t] of QGRP) {
    if (!groups.includes(g)) continue;
    const rows = doc.quotes.filter((q) => q.grp === g); if (!rows.length) continue;
    h += '<div class="qgrp">' + t + '</div><div class="qgrid">' + rows.map((q) => { const c = chgCls(q.chg); return '<div class="q"><div class="n">' + esc(q.name) + '</div><div class="p">' + fmt(q.price) + ' <small>' + esc(q.unit || '') + '</small></div><div class="c ' + c + '">' + chgTxt(q.chg) + '</div>' + spark(q.spark, c) + '</div>'; }).join('') + '</div>';
  }
  return h;
}

// navigáció
$('#tabs').addEventListener('click', (e) => { const b = e.target.closest('.tab'); if (!b) return; tab = b.dataset.t; render(); scrollTo({ top: 0, behavior: 'smooth' }); });
document.querySelectorAll('.bar button').forEach((b) => b.addEventListener('click', () => {
  const v = b.dataset.v;
  if (v === 'archive') return openArchive();
  if (v === 'settings') return openSettings();
  view = v; document.querySelectorAll('.bar button').forEach((x) => x.classList.toggle('on', x === b)); render(); scrollTo({ top: 0 });
}));
document.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => b.closest('.sheet').classList.remove('open')));
document.querySelectorAll('.sheet').forEach((s) => s.addEventListener('click', (e) => { if (e.target === s) s.classList.remove('open'); }));
$('#refresh').addEventListener('click', async () => { $('#refresh').style.transform = 'rotate(360deg)'; $('#refresh').style.transition = 'transform .5s'; await load(); setTimeout(() => { $('#refresh').style.transition = ''; $('#refresh').style.transform = ''; }, 520); toast('Frissítve'); });

async function openArchive() {
  $('#sArchive').classList.add('open'); $('#archList').innerHTML = '<div class="skel"></div><div class="skel"></div>';
  try {
    const idx = await getJSON('data/index.json');
    $('#archList').innerHTML = idx.map((x) => { const d = new Date(x.date + 'T12:00:00'); return '<button class="arch" data-id="' + esc(x.id) + '"><b>' + (x.kind === 'reggel' ? '☀️ ' : '🌙 ') + esc(d.toLocaleDateString('hu-HU', { month: 'long', day: 'numeric', weekday: 'long' })) + ' – ' + (x.kind === 'reggel' ? 'reggel' : 'este') + '</b><span>' + esc(x.headline || '') + '</span></button>'; }).join('') || '<p style="color:var(--tx2)">Még üres.</p>';
  } catch (e) { $('#archList').innerHTML = '<p style="color:var(--tx2)">Nem sikerült betölteni.</p>'; }
}
$('#archList').addEventListener('click', (e) => { const b = e.target.closest('.arch'); if (!b) return; $('#sArchive').classList.remove('open'); view = 'news'; tab = 'all'; document.querySelectorAll('.bar button').forEach((x) => x.classList.toggle('on', x.dataset.v === 'news')); load(b.dataset.id); scrollTo({ top: 0 }); });

// lehúzással frissítés
let py = null, pd = 0;
addEventListener('touchstart', (e) => { py = scrollY <= 0 && !document.querySelector('.sheet.open') ? e.touches[0].clientY : null; pd = 0; }, { passive: true });
addEventListener('touchmove', (e) => { if (py == null) return; pd = Math.max(0, e.touches[0].clientY - py); $('#ptr').style.transform = 'translate(-50%,' + (Math.min(pd, 90) - 60) + 'px)'; $('#ptr').textContent = pd > 80 ? '↻ Engedd el a frissítéshez' : '↓ Húzd le a frissítéshez'; }, { passive: true });
addEventListener('touchend', async () => { if (py == null) return; $('#ptr').style.transform = 'translate(-50%,-60px)'; if (pd > 80) { await load(); toast('Frissítve'); } py = null; });
document.addEventListener('visibilitychange', () => { if (!document.hidden && !viewingArchive) load(); });

// ---------- Telepítés ----------
let deferredInstall = null;
addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredInstall = e; showGetApp(); });
addEventListener('appinstalled', () => { deferredInstall = null; $('#getApp').style.display = 'none'; toast('Telepítve! Megtalálod az alkalmazásaid között.'); });
const isAndroid = () => /android/i.test(navigator.userAgent);
let apkUrl = null;
fetch('napi-hirek.apk', { method: 'HEAD' }).then((r) => { if (r.ok && /android|vnd|octet/i.test(r.headers.get('content-type') || 'application/vnd.android')) { apkUrl = 'napi-hirek.apk'; showGetApp(); } }).catch(() => {});
// „Letöltés” sáv: ingyenes telepítés Androidra (Chrome telepítés vagy APK fájl)
function showGetApp() {
  const el = $('#getApp');
  if (standalone() || localStorage.getItem('hirapp-hide-get') === '1') { el.style.display = 'none'; return; }
  if (deferredInstall) {
    el.innerHTML = '<img src="icon-192.png" alt=""><div class="t"><b>Napi Hírek alkalmazás</b>Ingyenes · értesítésekkel</div><button id="gaInst">Telepítés</button><button class="x" id="gaX" aria-label="Bezárás">✕</button>';
    $('#gaInst').onclick = async () => { deferredInstall.prompt(); const c = await deferredInstall.userChoice; if (c.outcome === 'accepted') el.style.display = 'none'; deferredInstall = null; };
  } else if (isAndroid() && apkUrl) {
    el.innerHTML = '<img src="icon-192.png" alt=""><div class="t"><b>Napi Hírek alkalmazás</b>Ingyenes Android-alkalmazás</div><a class="b" href="' + apkUrl + '" download>Letöltés</a><button class="x" id="gaX" aria-label="Bezárás">✕</button>';
  } else return;
  el.style.display = 'flex';
  $('#gaX').onclick = () => { el.style.display = 'none'; localStorage.setItem('hirapp-hide-get', '1'); };
}
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function openSettings() {
  $('#sSettings').classList.add('open');
  let ih = '';
  if (standalone()) ih = '<p style="color:var(--up);font-weight:600;margin:0">✓ Az alkalmazás telepítve van.</p>';
  else if (deferredInstall) ih = '<button class="btn" id="doInstall">📲 Alkalmazás telepítése (ingyenes)</button>' + (apkUrl ? '<a class="btn sec2" style="display:block;text-align:center;text-decoration:none" href="' + apkUrl + '" download>⬇️ Android APK letöltése</a>' : '');
  else if (isAndroid() && apkUrl) ih = '<a class="btn" style="display:block;text-align:center;text-decoration:none" href="' + apkUrl + '" download>⬇️ Android-alkalmazás letöltése (APK)</a><p style="color:var(--tx2);font-size:13px">Letöltés után nyisd meg a fájlt, és engedélyezd a telepítést (Ismeretlen forrásból származó alkalmazások).</p>';
  else if (isIOS()) ih = '<h4 style="margin:0 0 6px">📲 Telepítés iPhone-ra</h4><ol class="steps"><li>Nyisd meg ezt az oldalt <b>Safariban</b>.</li><li>Koppints a <b>Megosztás</b> gombra (négyzet felfelé nyíllal).</li><li>Válaszd: <b>Főképernyőhöz adás</b>.</li><li>Ezután a kezdőképernyőről indítsd – az értesítések csak így működnek iPhone-on.</li></ol>';
  else ih = '<h4 style="margin:0 0 6px">📲 Telepítés</h4><ol class="steps"><li>Nyisd meg a böngésző menüjét (⋮).</li><li>Válaszd: <b>Alkalmazás telepítése</b> vagy <b>Hozzáadás a kezdőképernyőhöz</b>.</li></ol>';
  $('#installBox').innerHTML = ih;
  const di = $('#doInstall'); if (di) di.onclick = async () => { deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall = null; openSettings(); };
  renderPush();
}

// ---------- Értesítések (Web Push) ----------
// A kulcspárt a telefon maga készíti; a kapott beállítás-szöveget egyszer kell bemásolni a GitHub-repó PUSH_CONFIG titkába.
const b64u = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64u = (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)), (c) => c.charCodeAt(0));
async function vapidKeys() {
  let k = null; try { k = JSON.parse(localStorage.getItem('hirapp-vapid') || 'null'); } catch (e) {}
  if (k && k.pub && k.priv) return k;
  const kp = await crypto.subtle.generateKey({ name: 'ECDSA', namedCurve: 'P-256' }, true, ['sign', 'verify']);
  k = { pub: b64u(await crypto.subtle.exportKey('raw', kp.publicKey)), priv: (await crypto.subtle.exportKey('jwk', kp.privateKey)).d };
  localStorage.setItem('hirapp-vapid', JSON.stringify(k)); return k;
}
async function renderPush(cfgText) {
  const box = $('#pushBox');
  if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) {
    box.innerHTML = '<p style="color:var(--tx2);font-size:14px">' + (isIOS() && !standalone() ? 'iPhone-on előbb tedd a kezdőképernyőre az alkalmazást (lásd fent), és onnan nyisd meg – utána itt bekapcsolhatod az értesítéseket. (iOS 16.4 vagy újabb kell.)' : 'Ez a böngésző nem támogatja az értesítéseket.') + '</p>';
    return;
  }
  const reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription();
  if (sub && !cfgText) {
    const k = await vapidKeys(); cfgText = JSON.stringify({ vapidPublic: k.pub, vapidPrivate: k.priv, sub: sub.toJSON() });
  }
  if (!sub) { box.innerHTML = '<button class="btn" id="pushOn">🔔 Értesítések bekapcsolása</button>'; $('#pushOn').onclick = enablePush; return; }
  box.innerHTML = '<p style="font-size:14px;margin:0 0 6px"><b style="color:var(--up)">✓ Bekapcsolva ezen a készüléken.</b> Utolsó lépés (csak egyszer): másold ki az alábbi szöveget, és mentsd el a GitHub-repóban <b>PUSH_CONFIG</b> néven (Settings → Secrets and variables → Actions → New repository secret).</p>' +
    '<textarea id="cfg" readonly>' + esc(cfgText) + '</textarea><button class="btn" id="copyCfg">📋 Másolás</button><button class="btn sec2" id="testPush">Próbaértesítés ezen a telefonon</button><button class="btn sec2" id="pushOff">Értesítések kikapcsolása</button>' +
    '<p style="color:var(--tx2);font-size:12px">Ez a szöveg titkos kulcsot tartalmaz – csak a GitHub titkok közé tedd, máshova ne.</p>';
  $('#copyCfg').onclick = async () => { try { await navigator.clipboard.writeText(cfgText); toast('Kimásolva'); } catch (e) { $('#cfg').select(); document.execCommand('copy'); toast('Kimásolva'); } };
  $('#testPush').onclick = async () => { (await navigator.serviceWorker.ready).showNotification('Napi Hírek', { body: 'Így fognak kinézni az értesítések. 👋', icon: 'icon-192.png', badge: 'icon-192.png' }); };
  $('#pushOff').onclick = async () => { const s = await reg.pushManager.getSubscription(); if (s) await s.unsubscribe(); toast('Kikapcsolva'); renderPush(); };
}
async function enablePush() {
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { toast('Az értesítések nincsenek engedélyezve'); return; }
    const k = await vapidKeys(), reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: unb64u(k.pub) });
    renderPush(JSON.stringify({ vapidPublic: k.pub, vapidPrivate: k.priv, sub: sub.toJSON() }));
  } catch (e) { console.error(e); toast('Hiba: ' + e.message); }
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch((e) => console.warn('SW:', e));
load();
</script>
