<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Napi Hírek</title>
<meta name="description" content="Napi politikai és tőzsdei hírösszefoglaló">
<meta name="theme-color" content="#0d1a33">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Napi Hírek">
<style>
:root{--bg:#0b1426;--bg2:#111d35;--card:#15223d;--line:#22335a;--tx:#eaf0fb;--tx2:#9fb0cf;--acc:#4da3ff;--up:#2ecc71;--down:#ff5d5d;--flat:#a8b3c7;--r:16px}
@media (prefers-color-scheme: light){:root:not([data-theme=dark]){--bg:#f2f5fa;--bg2:#fff;--card:#fff;--line:#dde4ef;--tx:#0f1b2e;--tx2:#5a6a85;--acc:#1f6fe0;--up:#14924a;--down:#d63031}}
:root[data-theme=light]{--bg:#f2f5fa;--bg2:#fff;--card:#fff;--line:#dde4ef;--tx:#0f1b2e;--tx2:#5a6a85;--acc:#1f6fe0;--up:#14924a;--down:#d63031}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:calc(10px + env(safe-area-inset-top)) 16px 8px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px}
.top img{width:34px;height:34px;border-radius:9px}
.top h1{font-size:20px;margin:0;flex:1;letter-spacing:-.2px}
.ibtn{border:0;background:var(--card);color:var(--tx);width:40px;height:40px;border-radius:12px;font-size:19px;display:grid;place-items:center;cursor:pointer;border:1px solid var(--line)}
.ibtn:active{transform:scale(.94)}
.sub{color:var(--tx2);font-size:13px;margin-top:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--tx2)}
.pill.ai{background:color-mix(in srgb,var(--acc) 22%,transparent);color:var(--acc)}
nav.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 2px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--tx2);padding:7px 13px;border-radius:99px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
main{padding:12px 16px;max-width:760px;margin:0 auto}
.hero{background:linear-gradient(135deg,#1d4fa8,#0f2c63);color:#fff;border-radius:var(--r);padding:16px 18px;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.hero small{opacity:.8;font-weight:700;letter-spacing:.6px;text-transform:uppercase;font-size:11px}
.hero p{margin:6px 0 0;font-size:18px;font-weight:650;line-height:1.35}
section.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 10px;margin-bottom:14px}
.sec h2{font-size:17px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.pt{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.pt:first-of-type{border-top:0}
.pt .dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--acc);margin-top:9px}
.pt .tx{flex:1}
.pt a{color:inherit;text-decoration:none}
.src{display:inline-flex;gap:4px;flex-wrap:wrap;margin-left:4px}
.src span{font-size:11px;color:var(--tx2);background:var(--bg);border:1px solid var(--line);padding:0 6px;border-radius:6px;white-space:nowrap}
details.more{margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
details.more summary{color:var(--acc);font-size:14px;font-weight:600;cursor:pointer;list-style:none;padding:4px 0}
details.more summary::-webkit-details-marker{display:none}
details.more a{display:block;color:var(--tx);text-decoration:none;font-size:14px;padding:7px 0;border-top:1px solid var(--line)}
details.more a i{color:var(--tx2);font-style:normal;font-size:12px}
.qgrp{font-size:12px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.6px;margin:12px 0 6px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.q{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 10px}
.q .n{font-size:13px;color:var(--tx2);font-weight:600}
.q .p{font-size:17px;font-weight:750;margin-top:2px;font-variant-numeric:tabular-nums}
.q .p small{font-size:11px;color:var(--tx2);font-weight:600}
.q .c{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--flat)}
.q svg{width:100%;height:26px;display:block;margin-top:4px}
.empty{text-align:center;color:var(--tx2);padding:50px 20px}
.empty b{display:block;color:var(--tx);font-size:18px;margin-bottom:6px}
.note{color:var(--tx2);font-size:12px;text-align:center;margin:8px 0 20px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;background:var(--bg2);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.bar button{flex:1;border:0;background:none;color:var(--tx2);font:600 11px system-ui;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;cursor:pointer}
.bar button span{font-size:21px}
.bar button.on{color:var(--acc)}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet .box{background:var(--bg2);width:100%;max-width:760px;max-height:85vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.sheet h3{margin:4px 0 12px;font-size:19px;display:flex;align-items:center}
.sheet h3 button{margin-left:auto}
.arch{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;font:inherit}
.arch b{display:block;font-size:14px}
.arch span{font-size:13px;color:var(--tx2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.btn{border:0;background:var(--acc);color:#fff;font:700 15px system-ui;padding:12px 16px;border-radius:12px;cursor:pointer;width:100%;margin:6px 0}
.btn.sec2{background:var(--card);color:var(--tx);border:1px solid var(--line)}
textarea{width:100%;height:120px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:12px ui-monospace,monospace;padding:8px}
.steps{padding-left:20px;color:var(--tx2);font-size:14px}
.steps li{margin:5px 0}
#ptr{position:fixed;top:calc(70px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-60px);z-index:15;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:13px;color:var(--tx2);transition:transform .2s}
#getApp{margin:10px 16px 0;padding:12px 14px;border-radius:14px;background:linear-gradient(135deg,#1f7a46,#14532f);color:#fff;display:flex;gap:12px;align-items:center}
#getApp img{width:44px;height:44px;border-radius:11px;flex:none}
#getApp .t{flex:1;font-size:14px;line-height:1.3}#getApp .t b{display:block;font-size:15px}
#getApp button,#getApp a.b{border:0;background:#fff;color:#14532f;font:800 14px system-ui;padding:9px 13px;border-radius:10px;cursor:pointer;text-decoration:none;white-space:nowrap}
#getApp .x{background:none;color:#fff;opacity:.7;padding:4px 6px;font-size:18px}

.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--up);margin:2px 0 4px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--up);animation:pl 1.6s infinite}
.live.old{color:var(--tx2)}.live.old i{background:var(--tx2);animation:none}
@keyframes pl{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--up) 60%,transparent)}100%{box-shadow:0 0 0 8px transparent}}
.q.flash-up{animation:fu 1.2s}.q.flash-down{animation:fd 1.2s}
@keyframes fu{0%{background:color-mix(in srgb,var(--up) 30%,var(--bg))}}@keyframes fd{0%{background:color-mix(in srgb,var(--down) 30%,var(--bg))}}

.fi{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--tx)}
.fi:first-of-type{border-top:0}
.fi .ic{flex:none;font-size:18px;line-height:1.3}
.fi .m{font-size:12px;color:var(--tx2);margin-bottom:2px}
.fi .tt{font-size:15px;font-weight:550;line-height:1.35}
.fi.uj .tt::before{content:'ÚJ';font-size:10px;font-weight:800;color:#fff;background:var(--down);border-radius:5px;padding:1px 5px;margin-right:6px;vertical-align:2px}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:14px;padding:14px 6px;text-align:center;font:600 13px system-ui;cursor:pointer}
.tile span{display:block;font-size:26px;margin-bottom:4px}
.inp,select.inp{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:10px;padding:10px 12px;font:15px system-ui;margin:4px 0}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.sw:first-child{border-top:0}
.sw input[type=checkbox]{width:44px;height:26px;appearance:none;-webkit-appearance:none;background:var(--line);border-radius:99px;position:relative;cursor:pointer;flex:none;transition:.2s}
.sw input[type=checkbox]::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw input[type=checkbox]:checked{background:var(--acc)}.sw input[type=checkbox]:checked::after{left:21px}
h4.st{margin:16px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--tx2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 6px 5px 12px;font-size:14px;display:inline-flex;align-items:center;gap:4px}
.chip button{border:0;background:none;color:var(--tx2);font-size:15px;cursor:pointer;padding:0 4px}
.li{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}.li:first-child{border-top:0}.li .g{flex:1}
.li small{color:var(--tx2);display:block}
.del{border:0;background:none;color:var(--down);font-size:18px;cursor:pointer}
.syncst{font-size:12px;color:var(--tx2);margin:4px 0 0}
.fi{position:relative}.fi a.lk{color:inherit;text-decoration:none;flex:1}
.fi .star{border:0;background:none;font-size:20px;cursor:pointer;color:var(--tx2);padding:0 2px;align-self:flex-start}
.fi .star.on{color:#f5b301}
.fi.kw{background:color-mix(in srgb,var(--acc) 10%,transparent);border-radius:10px;padding-left:6px;padding-right:6px}
.kwb{font-size:11px;font-weight:800;color:var(--acc);margin-right:4px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;margin:0 0 8px}
.seg button{flex:1;border:0;background:none;color:var(--tx2);font:600 13px system-ui;padding:7px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.cmp{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--bg)}
.cmp .ch{font-size:12px;color:var(--tx2);margin-bottom:4px}
.cmp a{display:block;color:var(--tx);text-decoration:none;padding:5px 0;border-top:1px dashed var(--line);font-size:14px}.cmp a:first-of-type{border-top:0}
.cmp a b{color:var(--acc);font-size:12px;display:block}
.cal{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line)}.cal:first-child{border-top:0}
.cal .tm{flex:none;width:52px;font-weight:700;font-variant-numeric:tabular-nums}
.cal .imp{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.cal small{color:var(--tx2)}
.conv{font-size:28px;font-weight:800;text-align:center;margin:10px 0;font-variant-numeric:tabular-nums}
mark{background:color-mix(in srgb,#f5b301 45%,transparent);color:inherit;border-radius:3px}

.q{cursor:pointer}
.chartbox{position:relative;margin:6px 0 2px;touch-action:none}
.chartbox svg{width:100%;height:230px;display:block}
.chinfo{display:flex;justify-content:space-between;align-items:baseline;margin:4px 0}
.chinfo b{font-size:24px;font-variant-numeric:tabular-nums}
.chinfo span{font-size:13px;color:var(--tx2)}
.pf{background:linear-gradient(135deg,#14532f,#1f7a46);color:#fff;border-radius:var(--r);padding:14px 16px;margin-bottom:14px;cursor:pointer}
.pf small{opacity:.85;font-weight:700;font-size:11px;letter-spacing:.6px;text-transform:uppercase}
.pf .v{font-size:26px;font-weight:800;margin:2px 0;font-variant-numeric:tabular-nums}
.pf .d{font-size:14px;font-weight:700}
.mac{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.mac:first-child{border-top:0}
.mac .g{flex:1}.mac .g small{color:var(--tx2);display:block;font-size:12px}
.mac .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.mac svg{width:90px;height:34px;flex:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;margin:6px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
table.pt2{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
table.pt2 th,table.pt2 td{padding:6px 4px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
table.pt2 th:first-child,table.pt2 td:first-child{text-align:left;white-space:normal}
.tts{display:flex;gap:8px;margin:-4px 0 12px}
.tts button{flex:1}
.wk{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;cursor:pointer}
.wk span{font-size:26px}.wk b{display:block}.wk small{color:var(--tx2)}
.qz{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;background:var(--bg)}
.qz p{margin:0 0 8px;font-weight:650}
.qz button{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:10px;padding:10px;margin:6px 0;font:15px system-ui;cursor:pointer}
.qz button.ok{border-color:var(--up);background:color-mix(in srgb,var(--up) 18%,var(--card))}
.qz button.bad{border-color:var(--down);background:color-mix(in srgb,var(--down) 18%,var(--card))}
.qz .ex{font-size:13px;color:var(--tx2);margin-top:6px}
.fi .shr{border:0;background:none;font-size:17px;cursor:pointer;color:var(--tx2);padding:0 2px;align-self:flex-start}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111c;color:#fff;padding:8px 14px;border-radius:10px;font-size:14px;z-index:60;display:none}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--line),var(--card),var(--line));background-size:200% 100%;animation:sh 1.2s infinite;margin:10px 0}
@keyframes sh{to{background-position:-200% 0}}
</style>
</head>
<body>
<header>
  <div class="top">
    <img src="icon-192.png" alt="">
    <h1>Napi Hírek</h1>
    <button class="ibtn" id="searchBtn" title="Keresés" aria-label="Keresés">🔍</button>
    <button class="ibtn" id="refresh" title="Frissítés" aria-label="Frissítés">⟳</button>
  </div>
  <div class="sub" id="meta"><span class="skel" style="width:160px;margin:2px 0"></span></div>
</header>
<div id="getApp" style="display:none"></div>
<nav class="tabs" id="tabs"></nav>
<div id="ptr">↓ Húzd le a frissítéshez</div>
<main id="main">
  <div class="skel" style="height:90px;border-radius:16px"></div><div class="skel"></div><div class="skel" style="width:70%"></div><div class="skel"></div>
</main>

<div class="bar">
  <button class="on" data-v="news"><span>📰</span>Hírek</button>
  <button data-v="friss"><span>⚡</span>Friss</button>
  <button data-v="quotes"><span>📈</span>Árfolyamok</button>
  <button data-v="saved"><span>🔖</span>Mentett</button>
  <button data-v="more"><span>☰</span>Több</button>
</div>

<div class="sheet" id="sArchive"><div class="box"><h3>Archívum <button class="ibtn" data-close>✕</button></h3><div id="archList"></div></div></div>
<div class="sheet" id="sSettings"><div class="box">
  <h3>Beállítások <button class="ibtn" data-close>✕</button></h3>
  <div id="installBox"></div>
  <h4 style="margin:14px 0 6px">🔔 Értesítések</h4>
  <p style="color:var(--tx2);font-size:14px;margin:0 0 8px">Reggel és este értesítést kapsz, amikor megérkezik a friss összefoglaló.</p>
  <div id="pushBox"></div>
</div></div>
<div class="sheet" id="sMore"><div class="box"><h3>Továbbiak <button class="ibtn" data-close>✕</button></h3><div class="tiles" id="moreTiles"></div></div></div>
<div class="sheet" id="sPanel"><div class="box"><h3><span id="panelTitle"></span> <button class="ibtn" data-close>✕</button></h3><div id="panelBody"></div></div></div>
<div class="sheet" id="sSearch"><div class="box"><h3>Keresés <button class="ibtn" data-close>✕</button></h3><input id="q" class="inp" type="search" placeholder="Keresés a hírekben… (pl. OTP, költségvetés)" autocomplete="off"><div id="qres"></div></div></div>
<div id="toast"></div>

<script>
'use strict';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const SECTIONS = [['hu_pol', '🇭🇺', 'Magyar politika', 'Magyar'], ['world', '🌍', 'Világpolitika', 'Világ'], ['hu_mkt', '📊', 'Magyar gazdaság és tőzsde', 'Magyar tőzsde'], ['w_mkt', '💹', 'Világgazdaság és tőzsde', 'Világtőzsde']];
const QGRP = [['wl', '⭐ Figyelőlista'], ['hu', '🇭🇺 Budapesti tőzsde'], ['fx', '💱 Forint'], ['w', '🌍 Világpiac'], ['c', '🛢️ Nyersanyag és kripto']];
let doc = null, view = 'news', tab = 'all', viewingArchive = false;

function toast(t) { const el = $('#toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => (el.style.display = 'none'), 2200); }
const fmt = (n) => n == null ? '–' : n.toLocaleString('hu-HU', { maximumFractionDigits: n >= 1000 ? 0 : n >= 10 ? 2 : 4 });
const chgCls = (c) => c == null ? 'flat' : c > 0.05 ? 'up' : c < -0.05 ? 'down' : 'flat';
const chgTxt = (c) => c == null ? '' : (c > 0 ? '▲ +' : c < 0 ? '▼ ' : '') + c.toFixed(2).replace('.', ',') + '%';
function spark(a, cls) {
  if (!a || a.length < 2) return '';
  const mn = Math.min(...a), mx = Math.max(...a), r = mx - mn || 1;
  const pts = a.map((v, i) => (i / (a.length - 1) * 100).toFixed(1) + ',' + (24 - (v - mn) / r * 22 + 1).toFixed(1)).join(' ');
  return '<svg viewBox="0 0 100 26" preserveAspectRatio="none"><polyline points="' + pts + '" fill="none" stroke="currentColor" stroke-width="2" vector-effect="non-scaling-stroke" class="' + cls + '"/></svg>';
}

async function getJSON(url) {
  const r = await fetch(url + (url.includes('?') ? '&' : '?') + 't=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function load(id) {
  try {
    doc = await getJSON(id ? 'data/archive/' + id + '.json' : 'data/latest.json');
    viewingArchive = !!id;
    try { localStorage.setItem('hirapp-last', JSON.stringify(doc)); } catch (e) {}
  } catch (e) {

const hex = (buf) => [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
async function deviceInfo() {
  if (!('serviceWorker' in navigator)) return null;
  const sub = await (await navigator.serviceWorker.ready).pushManager.getSubscription(); if (!sub) return null;
  const k = JSON.parse(localStorage.getItem('hirapp-vapid') || 'null'); if (!k) return null;

async function syncSettings() {
  const ri = repoInfo();
  if (!ghToken() || !ri) { setSync('Csak ezen a telefonon mentve – az értesítésekre a GitHub-kulcs után hatnak (Több → Szinkronizálás).'); return; }

    if (!dev) { setSync('Előbb kapcsold be az értesítéseket (Több → Értesítések bekapcsolása).'); return; }
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, dev.key, new TextEncoder().encode(JSON.stringify(S))));
    const blob = new Uint8Array(iv.length + ct.length); blob.set(iv); blob.set(ct, iv.length);
    const b64 = btoa(String.fromCharCode(...blob));
    const base = '/repos/' + ri.owner + '/' + ri.repo;
    if (!(await gh(base + '/branches/beallitasok'))) {
      const main = await gh(base + '/git/ref/heads/main');
      await gh(base + '/git/refs', { method: 'POST', body: JSON.stringify({ ref: 'refs/heads/beallitasok', sha: main.object.sha }) });
    }
    const ex = await gh(base + '/contents/' + dev.id + '.enc?ref=beallitasok');
    await gh(base + '/contents/' + dev.id + '.enc', { method: 'PUT', body: JSON.stringify({ message: 'Beállítások', branch: 'beallitasok', content: btoa(b64), ...(ex ? { sha: ex.sha } : {}) }) });

    '<path d="' + line + 'L' + X(pts.length - 1) + ',' + (H - 14) + 'L' + X(0) + ',' + (H - 14) + 'Z" fill="url(#cg)"/><path d="' + line + '" fill="none" stroke="' + col + '" stroke-width="2.2" vector-effect="non-scaling-stroke"/>' +
    '<line id="chL" x1="0" x2="0" y1="0" y2="' + (H - 14) + '" stroke="var(--tx2)" stroke-dasharray="3 3" vector-effect="non-scaling-stroke" style="display:none"/><circle id="chC" r="5" fill="' + col + '" style="display:none"/>' +
    '<text x="' + P + '" y="' + (H - 2) + '" font-size="12" fill="var(--tx2)">' + esc(fmtT(pts[0][0])) + '</text><text x="' + (W - P) + '" y="' + (H - 2) + '" font-size="12" fill="var(--tx2)" text-anchor="end">' + esc(fmtT(pts[pts.length - 1][0])) + '</text></svg></div>' +
    '<p class="note" style="margin:4px 0 0">Min: ' + fmt(mn) + ' · Max: ' + fmt(mx) + ' · Húzd végig az ujjad a grafikonon!</p>';
  const box = document.querySelector('.chartbox'), svg = box.querySelector('svg');
  const move = (ev) => {
    const rc = svg.getBoundingClientRect(), x = ((ev.touches ? ev.touches[0].clientX : ev.clientX) - rc.left) / rc.width * W;
    const i = Math.max(0, Math.min(pts.length - 1, Math.round((x - P) / (W - 2 * P) * (pts.length - 1)))), p = pts[i];
    const L = $('#chL'), C = $('#chC'); L.setAttribute('x1', X(i)); L.setAttribute('x2', X(i)); L.style.display = ''; C.setAttribute('cx', X(i)); C.setAttribute('cy', Y(p[1])); C.style.display = '';
    $('#chV').innerHTML = fmt(p[1]) + ' <small style="font-size:13px;color:var(--tx2)">' + esc(unit || '') + '</small>'; $('#chT').textContent = fmtT(p[0]); $('#chT').className = '';
  };
  const end = () => { drawChart(pts); };
  box.addEventListener('pointermove', move); box.addEventListener('pointerdown', move); box.addEventListener('pointerleave', end); box.addEventListener('pointerup', (e) => { if (e.pointerType !== 'mouse') end(); });
}

// ---------- Magyar gazdasági mutatók ----------
EXTRA_PANELS.macro = () => '<div id="macBox"><div class="skel"></div><div class="skel"></div></div>';
EXTRA_AFTER.macro = async () => {
  try {
    const d = await getRaw('makro.json', 600e3), q = (n) => curQuotes().find((x) => x.name === n);
    let h = '';
    for (const m of d.items || []) {
      const ch = m.prev != null ? m.value - m.prev : null, mo = new Date(m.date + 'T00:00:00').toLocaleDateString('hu-HU', { year: 'numeric', month: 'long' });
      h += '<div class="mac"><div class="g"><b>' + esc(m.name) + '</b><small>' + esc(mo) + (ch != null ? ' · előző hónaphoz: ' + (ch > 0 ? '+' : '') + ch.toFixed(2).replace('.', ',') + ' %-pont' : '') + '</small></div>' + spark(m.hist, ch > 0 ? 'down' : 'up').replace('<svg', '<svg style="width:90px;height:34px"') + '<div class="v">' + m.value.toFixed(m.value < 10 ? 2 : 1).replace('.', ',') + '%</div></div>';
    }
    for (const n of ['EUR/HUF', 'USD/HUF']) { const x = q(n); if (x) h += '<div class="mac"><div class="g"><b>' + n + '</b><small>élő árfolyam</small></div>' + spark(x.spark, chgCls(x.chg)).replace('<svg', '<svg style="width:90px;height:34px"') + '<div class="v">' + fmt(x.price) + '</div></div>'; }
    $('#macBox').innerHTML = h + '<p class="note" style="text-align:left">Forrás: OECD és Eurostat adatai a St. Louis-i Fed (FRED) adatbázisán keresztül. Havi adatok, a megjelenés 1–2 hónapot késhet. A BUBOR (bankközi kamat) jellemzően az MNB alapkamata közelében mozog.</p>';
  } catch (e) { $('#macBox').innerHTML = '<p style="color:var(--tx2)">A mutatók most nem érhetők el – a GitHub naponta kétszer frissíti őket, próbáld később.</p>'; }
};

// ---------- Közvélemény-kutatások ----------
EXTRA_PANELS.polls = () => '<div id="polBox"><div class="skel" style="height:200px"></div></div>';
EXTRA_AFTER.polls = async () => {
  try {
    const d = await getRaw('kozvelemeny.json', 600e3), polls = (d.polls || []).filter((p) => !/election|választás/i.test(p.firm));
    if (!polls.length) throw new Error();
    const last = polls.slice(0, 12), avg = {};
    last.forEach((p) => Object.entries(p.vals).forEach(([k, v]) => { (avg[k] = avg[k] || []).push(v); }));
    const parties = Object.keys(avg).sort((a, b) => avg[b].reduce((x, y) => x + y, 0) / avg[b].length - avg[a].reduce((x, y) => x + y, 0) / avg[a].length).slice(0, 7);
    const series = polls.slice(0, 60).reverse(), t0 = Date.parse(series[0].date), t1 = Date.parse(series[series.length - 1].date) || t0 + 1;
    const W = 600, H = 220, P = 8, max = Math.max(10, ...series.flatMap((p) => parties.map((k) => p.vals[k] || 0))) * 1.1;
    const X = (d) => P + (Date.parse(d) - t0) / Math.max(1, t1 - t0) * (W - 2 * P), Y = (v) => P + (1 - v / max) * (H - 2 * P);
    let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" style="width:100%;height:220px">';
    [10, 20, 30, 40, 50].filter((v) => v < max).forEach((v) => { svg += '<line x1="0" x2="' + W + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="var(--line)" vector-effect="non-scaling-stroke"/><text x="2" y="' + (Y(v) - 2) + '" font-size="11" fill="var(--tx2)">' + v + '%</text>'; });
    parties.forEach((k, i) => {
      const pts = series.filter((p) => p.vals[k] != null);
      if (pts.length > 1) svg += '<path d="' + pts.map((p, j) => (j ? 'L' : 'M') + X(p.date).toFixed(1) + ',' + Y(p.vals[k]).toFixed(1)).join('') + '" fill="none" stroke="' + PALETTE[i] + '" stroke-width="2" vector-effect="non-scaling-stroke"/>';
      pts.forEach((p) => { svg += '<circle cx="' + X(p.date).toFixed(1) + '" cy="' + Y(p.vals[k]).toFixed(1) + '" r="2.5" fill="' + PALETTE[i] + '"/>'; });
    });
    svg += '</svg>';
    let h = '<p style="color:var(--tx2);font-size:13px;margin:0 0 6px">Pártok támogatottsága a nyilvánosan közzétett felmérések szerint (a biztos szavazó pártválasztók körében, ahogy az intézetek közölték). Az egyes intézetek eredményei eltérhetnek egymástól.</p>' + svg +
      '<div class="legend">' + parties.map((k, i) => '<span><i style="background:' + PALETTE[i] + '"></i>' + esc(k) + '</span>').join('') + '</div>' +
      '<h4 class="st">Legutóbbi felmérések</h4><div style="overflow-x:auto"><table class="pt2"><tr><th>Intézet, időpont</th>' + parties.map((k) => '<th>' + esc(k) + '</th>').join('') + '</tr>' +
      polls.slice(0, 15).map((p) => '<tr><td>' + esc(p.firm) + '<br><small style="color:var(--tx2)">' + esc(p.date) + (p.sample ? ' · ' + (+p.sample).toLocaleString('hu-HU') + ' fő' : '') + '</small></td>' + parties.map((k) => '<td>' + (p.vals[k] != null ? p.vals[k] : '–') + '</td>').join('') + '</tr>').join('') + '</table></div>' +
      '<p class="note" style="text-align:left">Forrás: <a href="' + esc(d.page) + '" target="_blank" rel="noopener" style="color:var(--acc)">Wikipédia – közvélemény-kutatások összesítése</a>. Naponta többször frissül.</p>';
    $('#polBox').innerHTML = h;
  } catch (e) { $('#polBox').innerHTML = '<p style="color:var(--tx2)">A közvélemény-kutatások most nem érhetők el – próbáld később.</p>'; }
};

// ---------- Parlament ----------
const PARL = /országgyűlés|orszaggyules|parlament|törvényjavaslat|torvenyjavaslat|törvénymódosítás|képviselő|kepviselo|frakció|frakcio|házelnök|hazelnok|szavaz|módosító|interpelláció|napirend|ülésszak|alaptörvény/i;
EXTRA_PANELS.parl = () => {
  const items = ((friss && friss.items) || []).filter((it) => it.sec === 'hu_pol' && PARL.test(it.title + ' ' + (it.d || '')));
  return '<p style="color:var(--tx2);font-size:13px;margin:0 0 6px">Az Országgyűlésről, törvényjavaslatokról és szavazásokról szóló friss hírek a lapokból. A hivatalos napirend és a szavazások eredménye a <a href="https://www.parlament.hu" target="_blank" rel="noopener" style="color:var(--acc)">parlament.hu</a> oldalon érhető el.</p>' +
    (items.length ? items.slice(0, 60).map(itemHTML).join('') : '<p style="color:var(--tx2)">Az elmúlt időszakban nem volt ilyen hír.</p>');
};

// ---------- Napi kvíz ----------
let quizState = null;
EXTRA_PANELS.quiz = () => '<div id="qzBox"><div class="skel"></div></div>';
EXTRA_AFTER.quiz = async () => {
  let qs = null, src = '';
  try { const d = await getJSON('data/kviz.json'); if (d && d.questions && Date.now() - Date.parse(d.date + 'T23:59:59') < 36 * 3600e3) { qs = d.questions; src = 'A mai hírekből, Claude készítette.'; } } catch (e) {}
  if (!qs) { // kulcs nélkül: „Melyik lap írta ezt a címet?”
    const its = ((friss && friss.items) || []).slice(0, 80), srcs = [...new Set(its.map((x) => x.source))];
    if (its.length < 5 || srcs.length < 4) { $('#qzBox').innerHTML = '<p style="color:var(--tx2)">Most még nincs elég hír a kvízhez – nézz vissza később!</p>'; return; }
    const pick = its.slice().sort(() => Math.random() - 0.5).slice(0, 5);
    qs = pick.map((it) => { const opts = [it.source].concat(srcs.filter((x) => x !== it.source).sort(() => Math.random() - 0.5).slice(0, 3)).sort(() => Math.random() - 0.5); return { q: 'Melyik lap hozta ezt a hírt? „' + it.title + '”', options: opts, answer: opts.indexOf(it.source), explain: it.source + ' – ' + ago(it.t) }; });
    src = 'Kérdések a friss hírekből. (Claude API-kulccsal este 5 tartalmi kérdés is készül a nap híreiből.)';
  }
  quizState = { qs, ans: [], src }; drawQuiz();
};
function drawQuiz() {
  const s = quizState; let h = '<p style="color:var(--tx2);font-size:13px;margin:0">' + esc(s.src) + '</p>', score = 0;
  s.qs.forEach((q, i) => {
    const a = s.ans[i]; if (a === q.answer) score++;
    h += '<div class="qz"><p>' + (i + 1) + '. ' + esc(q.q) + '</p>' + q.options.map((o, j) => '<button data-qi="' + i + '" data-oi="' + j + '" class="' + (a != null ? (j === q.answer ? 'ok' : j === a ? 'bad' : '') : '') + '"' + (a != null ? ' disabled' : '') + '>' + esc(o) + '</button>').join('') + (a != null && q.explain ? '<div class="ex">' + esc(q.explain) + '</div>' : '') + '</div>';
  });
  if (s.ans.filter((x) => x != null).length === s.qs.length) {
    const best = Math.max(score, +(localStorage.getItem('hirapp-quiz-best') || 0)); localStorage.setItem('hirapp-quiz-best', best);
    h += '<div class="hero"><small>Eredmény</small><p>' + score + ' / ' + s.qs.length + (score === s.qs.length ? ' – hibátlan! 🎉' : '') + '</p></div><button class="btn sec2" id="qzAgain">Új kör</button>';
  }
  $('#qzBox').innerHTML = h;
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('#qzBox button[data-qi]'); if (b && quizState) { quizState.ans[+b.dataset.qi] = +b.dataset.oi; drawQuiz(); return; }
  if (e.target.closest('#qzAgain')) EXTRA_AFTER.quiz();
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch((e) => console.warn('SW:', e));
load().then(() => { pollLive(true); pollBtc(); pollFriss(true); setTimeout(showGetApp, 800); });
</script>
