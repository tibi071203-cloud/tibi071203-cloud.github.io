name: Android-alkalmazás (APK)

# Elkészíti a letölthető napi-hirek.apk fájlt a GitHub szerverein, a Google hivatalos Android-eszközeivel.
# Magától lefut, amikor feltöltöd a repót (ha még nincs APK). Újra a Actions fülön a „Run workflow” gombbal indítható.
on:
  push:
    branches: [main]
    paths-ignore: ['data/**', 'napi-hirek.apk', '.well-known/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      kesz: ${{ steps.done.outputs.kesz }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Kell-e új APK?
        id: need
        run: |
          if [ -f napi-hirek.apk ] && [ "${{ github.event_name }}" = "push" ]; then
            echo "Már van APK, nem készítem újra (kézzel a Run workflow gombbal lehet)."
            echo "build=0" >> "$GITHUB_OUTPUT"
          else
            echo "build=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.need.outputs.build == '1'
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        if: steps.need.outputs.build == '1'
        with:
          node-version: '22'

      - name: Android SDK előkészítése
        if: steps.need.outputs.build == '1'
        run: |
          set +o pipefail   # a "yes |" különben hibát jelezne, amikor az sdkmanager végez
          SDK="$ANDROID_HOME"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null || true
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "build-tools;36.1.0" "platforms;android-36" > /dev/null || true
          if [ ! -d "$SDK/build-tools/36.1.0" ] || [ ! -d "$SDK/platforms/android-36" ]; then
            echo "::error::Az Android build-tools 36.1.0 / android-36 telepítése nem sikerült"; ls "$SDK/build-tools" "$SDK/platforms"; exit 1
          fi
          echo "Android SDK rendben."
          mkdir -p "$HOME/bwsdk"
          for f in "$SDK"/*; do ln -sfn "$f" "$HOME/bwsdk/$(basename "$f")"; done
          [ -e "$HOME/bwsdk/bin" ] || ln -s "$SDK/cmdline-tools/latest/bin" "$HOME/bwsdk/bin"
          mkdir -p "$HOME/.bubblewrap"
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$HOME/bwsdk\"}" > "$HOME/.bubblewrap/config.json"
          npm install -g @bubblewrap/cli@1.28.0 --no-audit --no-fund

      - name: Aláíró kulcs
        if: steps.need.outputs.build == '1'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p build-android
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > build-android/android.keystore
            echo "PW=$KS_PASS" >> "$GITHUB_ENV"
            echo "Saját (titokban tárolt) kulcs használata."
          else
            PW="$(openssl rand -hex 16)"
            echo "::add-mask::$PW"
            keytool -genkeypair -noprompt -keystore build-android/android.keystore -alias napihirek -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$PW" -keypass "$PW" -dname "CN=Napi Hirek"
            echo "PW=$PW" >> "$GITHUB_ENV"
            echo "Új aláíró kulcs készült."
          fi

      - name: APK készítése
        if: steps.need.outputs.build == '1'
        run: |
          python3 -m http.server 8799 > /dev/null 2>&1 &
          sleep 2
          node twa.js "${{ github.repository_owner }}" "${{ github.event.repository.name }}" "${{ github.run_number }}" http://localhost:8799
          cd build-android
          bubblewrap update --skipVersionUpgrade < /dev/null
          BUBBLEWRAP_KEYSTORE_PASSWORD="$PW" BUBBLEWRAP_KEY_PASSWORD="$PW" bubblewrap build --skipPwaValidation < /dev/null
          ls -la *.apk

      - name: APK és összekötő fájl mentése
        id: done
        if: steps.need.outputs.build == '1'
        run: |
          cp build-android/app-release-signed.apk napi-hirek.apk
          PKG=$(node -p "require('./build-android/twa-manifest.json').packageId")
          FP=$(keytool -list -v -keystore build-android/android.keystore -alias napihirek -storepass "$PW" | grep -m1 'SHA256:' | sed 's/.*SHA256: *//')
          mkdir -p .well-known
          node -e "
            const fs=require('fs'), p='.well-known/assetlinks.json'; let fps=['$FP'];
            try { const old=JSON.parse(fs.readFileSync(p,'utf8')); const t=old[0]&&old[0].target; if(t&&t.package_name==='$PKG') fps=[...new Set(fps.concat((t.sha256_cert_fingerprints||[]).filter(x=>/^[0-9A-F:]{95}$/.test(x))))]; } catch(e){}
            fs.writeFileSync(p, JSON.stringify([{relation:['delegate_permission/common.handle_all_urls'],target:{namespace:'android_app',package_name:'$PKG',sha256_cert_fingerprints:fps}}],null,2));"
          cat .well-known/assetlinks.json
          git config user.name "hirapp-bot"
          git config user.email "hirapp-bot@users.noreply.github.com"
          git add napi-hirek.apk .well-known/assetlinks.json
          git commit -m "Android APK (${{ github.run_number }})"
          git pull --rebase
          git push
          echo "kesz=1" >> "$GITHUB_OUTPUT"

  kozzetetel:
    needs: apk
    if: needs.apk.outputs.kesz == '1'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
