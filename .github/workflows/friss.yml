name: Friss hírek értesítés

# Egy futás kb. 25 percig tart, percenként frissít, a végén maga indítja a következőt.
# Az 5 perces ütemezés csak tartalék, ha a lánc megszakadna.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: friss
  cancel-in-progress: false

jobs:
  friss:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Látott hírek betöltése
        uses: actions/cache/restore@v4
        with:
          path: seen.json
          key: seen-${{ github.run_id }}
          restore-keys: seen-
      - name: Hírek és árfolyamok percenként (kb. 25 percig)
        env:
          PUSH_CONFIG: ${{ secrets.PUSH_CONFIG }}
          GH_TOKEN: ${{ github.token }}
          APP_URL: https://${{ github.repository_owner }}.github.io/
          FUTASI_PERC: '25'
        run: node friss.js
      - name: Látott hírek mentése
        if: always()
        uses: actions/cache/save@v4
        with:
          path: seen.json
          key: seen-${{ github.run_id }}
      - name: Következő futás indítása
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run friss.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" || echo "Nem sikerült – az ütemező indítja újra."
