name: Friss hírek értesítés

# Folyamatos frissítés: a GitHub 5 percenként indítja, egy futás kb. 4,5 percig tart és közben PERCENKÉNT
# ellenőrzi a híreket (értesítés minden új hírről) és az árfolyamokat, majd feltölti őket az alkalmazásnak.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: friss
  cancel-in-progress: false

jobs:
  friss:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Látott hírek betöltése
        uses: actions/cache/restore@v4
        with:
          path: seen.json
          key: seen-${{ github.run_id }}
          restore-keys: seen-
      - name: Hírek és árfolyamok percenként (kb. 4,5 percig)
        env:
          PUSH_CONFIG: ${{ secrets.PUSH_CONFIG }}
          GH_TOKEN: ${{ github.token }}
          APP_URL: https://${{ github.repository_owner }}.github.io/
        run: node friss.js
      - name: Látott hírek mentése
        if: always()
        uses: actions/cache/save@v4
        with:
          path: seen.json
          key: seen-${{ github.run_id }}
